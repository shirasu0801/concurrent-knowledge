<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>{{.Title}} | Concurrent Knowledge - IT用語クイズ</title>
    <meta name="description" content="{{.Description}}">
    <meta name="keywords" content="IT用語,クイズ,システムエンジニア,OS,ネットワーク,データベース,クラウド,セキュリティ,プログラミング,プロジェクト管理,{{.Genre}}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{.Title}} | Concurrent Knowledge">
    <meta property="og:description" content="{{.Description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{.CanonicalURL}}">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{.CanonicalURL}}">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/static/css/main.css">
    {{block "styles" .}}{{end}}
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <a href="/">Concurrent Knowledge</a>
            </h1>
            <nav class="nav">
                <a href="/" class="nav-link">ホーム</a>
                <a href="/review" class="nav-link">復習リスト</a>
                <a href="/admin/questions" class="nav-link">問題管理</a>
            </nav>
        </div>
    </header>

    <main class="main">
        {{block "content" .}}{{end}}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Concurrent Knowledge. IT用語クイズアプリ</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="/static/js/storage.js"></script>
    {{block "scripts" .}}{{end}}
</body>
</html>
