{{define "content"}}
<div class="container">
    <section class="quiz-container" id="quizContainer">
        <!-- Quiz header -->
        <div class="quiz-header">
            <div class="quiz-progress">
                <span id="questionNumber">1</span> / <span id="totalQuestions">10</span>
            </div>
            <div class="quiz-timer" id="timer">60</div>
        </div>

        <!-- Question -->
        <div class="question-container">
            <h3 class="question-text" id="questionText">読み込み中...</h3>

            <div class="options-container" id="optionsContainer">
                <!-- Options will be inserted here -->
            </div>
        </div>

        <!-- Answer feedback (hidden initially) -->
        <div class="answer-feedback" id="answerFeedback" style="display: none;">
            <div class="feedback-result" id="feedbackResult"></div>
            <div class="feedback-explanation" id="feedbackExplanation"></div>
            <div class="feedback-score" id="feedbackScore"></div>
            <button class="btn btn-primary" id="nextButton">次の問題</button>
        </div>
    </section>
</div>
{{end}}

{{define "scripts"}}
<script src="/static/js/timer.js"></script>
<script src="/static/js/quiz.js"></script>
{{end}}
